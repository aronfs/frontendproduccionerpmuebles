<div class="container">
  <div class="header">
    <h1>Bitácora de Trazabilidad</h1>
  </div>

  <div class="search-container">
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Buscar</mat-label>
      <input matInput (keyup)="aplicarFiltroTabla($event)" placeholder="Buscar en la bitácora">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="dataListaTrazabilidad" class="mat-elevation-z8">
      <!-- Etapa Column -->
      <ng-container matColumnDef="etapa">
        <th mat-header-cell *matHeaderCellDef> Etapa </th>
        <td mat-cell *matCellDef="let trazabilidad"> {{trazabilidad.etapa}} </td>
      </ng-container>

      <!-- Acción Column -->
      <ng-container matColumnDef="accion">
        <th mat-header-cell *matHeaderCellDef> Acción </th>
        <td mat-cell *matCellDef="let trazabilidad"> {{trazabilidad.accion}} </td>
      </ng-container>

      <!-- Descripción Column -->
      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef> Descripción </th>
        <td mat-cell *matCellDef="let trazabilidad"> {{trazabilidad.descripcion}} </td>
      </ng-container>

      <!-- Fecha Column -->
      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef> Fecha </th>
        <td mat-cell *matCellDef="let trazabilidad"> {{trazabilidad.fecha | date:'dd/MM/yyyy HH:mm'}} </td>
      </ng-container>

      <!-- Usuario Column -->
      <ng-container matColumnDef="usuario">
        <th mat-header-cell *matHeaderCellDef> Usuario </th>
        <td mat-cell *matCellDef="let trazabilidad"> {{trazabilidad.usuario}} </td>
      </ng-container>

      <!-- Cliente Column -->
      <ng-container matColumnDef="cliente">
        <th mat-header-cell *matHeaderCellDef> Cliente </th>
        <td mat-cell *matCellDef="let trazabilidad"> {{trazabilidad.cliente}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnasTable"></tr>
      <tr mat-row *matRowDef="let row; columns: columnasTable;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of trazabilidad"></mat-paginator>
  </div>
</div>
