<div class="container">
  <div class="header">
    <h1>Trabajo en Progreso</h1>
  </div>

  <div class="search-container">
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Buscar</mat-label>
      <input matInput (keyup)="aplicarFiltroTabla($event)" placeholder="Buscar por código o operador">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="dataListaWip" class="mat-elevation-z8">
      <!-- Código Orden -->
      <ng-container matColumnDef="codigoOrden">
        <th mat-header-cell *matHeaderCellDef>Código Orden</th>
        <td mat-cell *matCellDef="let wip">{{wip.codigoOrden}}</td>
      </ng-container>

      <!-- Nombre Operador -->
      <ng-container matColumnDef="nombreOperador">
        <th mat-header-cell *matHeaderCellDef>Operador</th>
        <td mat-cell *matCellDef="let wip">{{wip.nombreOperador || 'Sin asignar'}}</td>
      </ng-container>

      <!-- Estado -->
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let wip">
          <span [ngClass]="{
            'estado-iniciado': wip.estado === 'iniciado',
            'estado-pausado': wip.estado === 'pausado',
            'estado-proceso': wip.estado === 'en proceso',
            'estado-completado': wip.estado === 'completado'
          }">
            {{wip.estado}}
          </span>
        </td>
      </ng-container>

      <!-- Fecha Inicio -->
      <ng-container matColumnDef="fecha_inicio">
        <th mat-header-cell *matHeaderCellDef>Fecha Inicio</th>
        <td mat-cell *matCellDef="let wip">{{wip.fecha_inicio | date:'dd/MM/yyyy'}}</td>
      </ng-container>

      <!-- Fecha Fin -->
      <ng-container matColumnDef="fecha_fin">
        <th mat-header-cell *matHeaderCellDef>Fecha Fin</th>
        <td mat-cell *matCellDef="let wip">{{wip.fecha_fin | date:'dd/MM/yyyy'}}</td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef style="width: 120px;">Acciones</th>
        <td mat-cell *matCellDef="let wip">
          <button mat-icon-button color="primary" (click)="asignarOperador(wip)" *ngIf="!wip.nombreOperador">
            <mat-icon>person_add</mat-icon>
          </button>
          <button mat-icon-button color="accent" (click)="editarWip(wip)" *ngIf="wip.nombreOperador">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminarWip(wip)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnasTable"></tr>
      <tr mat-row *matRowDef="let row; columns: columnasTable;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons></mat-paginator>
  </div>
</div>
