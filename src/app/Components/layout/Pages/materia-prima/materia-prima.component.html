<div class="container">
  <div class="header">
    <h1>Gestión de Materia Prima</h1>
    <button mat-raised-button color="primary" (click)="nuevaMateriaPrima()">
      <mat-icon>add</mat-icon> Nueva Materia Prima
    </button>
  </div>

  <div class="search-container">
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Buscar</mat-label>
      <input matInput (keyup)="aplicarFiltroTabla($event)" placeholder="Buscar por nombre o descripción">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="dataListaMateriaPrima" class="mat-elevation-z8">
      <!-- Nombre Producto Column -->
      <ng-container matColumnDef="nombreProducto">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let materiaPrima"> {{materiaPrima.nombreProducto}} </td>
      </ng-container>

      <!-- Unidad Medida Column -->
      <ng-container matColumnDef="unidadMedida">
        <th mat-header-cell *matHeaderCellDef> Unidad Medida </th>
        <td mat-cell *matCellDef="let materiaPrima"> {{materiaPrima.unidadMedida}} </td>
      </ng-container>

      <!-- Descripción Column -->
      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef> Descripción </th>
        <td mat-cell *matCellDef="let materiaPrima"> {{materiaPrima.descripcion}} </td>
      </ng-container>

      <!-- Precio Column -->
      <ng-container matColumnDef="precio">
        <th mat-header-cell *matHeaderCellDef> Precio </th>
        <td mat-cell *matCellDef="let materiaPrima"> {{materiaPrima.precio | currency}} </td>
      </ng-container>

      <!-- Usuario Column -->
      <ng-container matColumnDef="usuario">
        <th mat-header-cell *matHeaderCellDef> Usuario </th>
        <td mat-cell *matCellDef="let materiaPrima"> {{materiaPrima.usuario}} </td>
      </ng-container>

      <!-- Acciones Column -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let materiaPrima">
          <button mat-icon-button color="primary" (click)="editarMateriaPrima(materiaPrima)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminarMateriaPrima(materiaPrima)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnasTable"></tr>
      <tr mat-row *matRowDef="let row; columns: columnasTable;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of materia prima"></mat-paginator>
  </div>
</div>
