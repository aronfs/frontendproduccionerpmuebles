<div class="container">
  <div class="header">
    <h1>Gestión de Bodegas</h1>
    <button mat-raised-button color="primary" (click)="nuevaBodega()">
      <mat-icon>add</mat-icon> Nueva Bodega
    </button>
  </div>

  <div class="search-container">
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Buscar</mat-label>
      <input matInput (keyup)="aplicarFiltroTabla($event)" placeholder="Buscar por nombre o ubicación">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="dataListaBodegas" class="mat-elevation-z8">
      <!-- Nombre Column -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let bodega"> {{bodega.nombre}} </td>
      </ng-container>

      <!-- Ubicación Column -->
      <ng-container matColumnDef="ubicacion">
        <th mat-header-cell *matHeaderCellDef> Ubicación </th>
        <td mat-cell *matCellDef="let bodega"> {{bodega.ubicacion}} </td>
      </ng-container>

      <!-- Fecha Registro Column -->
      <ng-container matColumnDef="fechaRegistro">
        <th mat-header-cell *matHeaderCellDef> Fecha Registro </th>
        <td mat-cell *matCellDef="let bodega"> {{bodega.fechaRegistro | date:'dd/MM/yyyy'}} </td>
      </ng-container>

      <!-- Acciones Column -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let bodega">
          <button mat-icon-button color="primary" (click)="editarBodega(bodega)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminarBodega(bodega)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnasTable"></tr>
      <tr mat-row *matRowDef="let row; columns: columnasTable;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of bodegas"></mat-paginator>
  </div>
</div>
